# Standalone local infrastructure; the application runs with npm run start:dev.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set canonical DATABASE_URL}
    entrypoint: ['/bin/sh', '/opt/postgres-entrypoint.sh']
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-entrypoint.sh:/opt/postgres-entrypoint.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
