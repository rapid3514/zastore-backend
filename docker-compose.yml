services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set production DATABASE_URL in .env}
    entrypoint: ['/bin/sh', '/opt/postgres-entrypoint.sh']
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-entrypoint.sh:/opt/postgres-entrypoint.sh:ro
    networks:
      - data_network
    healthcheck:
      test: ['CMD-SHELL', 'connection=$${DATABASE_URL#postgresql://}; credentials=$${connection%%@*}; location=$${connection#*@}; user=$${credentials%%:*}; database=$${location#*/}; database=$${database%%\?*}; pg_isready -h 127.0.0.1 -U "$${user}" -d "$${database}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    logging: &default-logging
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    networks:
      - data_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 10s
    logging: *default-logging

  migrate:
    build:
      context: .
      target: migration
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Run Docker Compose with --env-file .env.production}
    networks:
      - data_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    build:
      context: .
      target: production
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Run Docker Compose with --env-file .env.production}
      REDIS_URL: ${REDIS_URL:?Run Docker Compose with --env-file .env.production}
      TRUST_PROXY_CIDRS: 172.30.0.0/24
    expose:
      - '3000'
    networks:
      - edge_network
      - data_network
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Run Docker Compose with --env-file .env.production}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge_network
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *default-logging

  telegram-webhook:
    profiles: ['operations']
    build:
      context: .
      target: migration
    env_file:
      - .env.production
    command: ['npm', 'run', 'telegram:webhook']
    networks:
      - edge_network
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  edge_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data_network:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
